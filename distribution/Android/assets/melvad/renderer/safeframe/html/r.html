<!DOCTYPE html>
<html>
	<head>
	<meta http-equiv="Cache-Control" content="public" />
	<meta http-equiv="Expires" content="Mon, 16 Nov 2020 00:00:01 GMT" />
	<meta http-equiv="imagetoolbar" content="no" />
	<meta http-equiv="imagetoolbar" content="false" />
	<meta name="ROBOTS" content="NOINDEX" />
	<meta name="ROBOTS" content="NOFOLLOW" />
	<meta name="ROBOTS" content="NOARCHIVE" />
	<meta name="ROBOTS" content="NOSNIPPET" />
	<meta name="ROBOTS" content="NOODP " />
	<base target="_top" />
	<title></title>
	<script type="text/javascript">
		(function () {
  var publisher = window.parent;
  window.addEventListener('message', function (event) {
    if(event.source!==publisher || event.origin!=='https://sdk.melvad.invalid' || typeof event.data!=='string' || event.data.length>32768) return;
    var packet; try { packet=JSON.parse(event.data); } catch (_) { return; }
    if(packet?.type!=='melvad:viewport' || typeof packet.visible!=='boolean') return;
    window.__melvadHostPacket=packet;
    document.dispatchEvent(new Event('melvad:host'));
  });
})();
window.onerror = function() { return true; };
	</script>
	<style type="text/css">
		#sf_body { margin:0px;padding:0px;background-color:transparent; }
	</style>
	</head>
	<body id="sf_body">
		<div id="sf_align" class="sf">
			<script src="../js/lib/base.js" class="sf"></script>
			<script src="../js/ext/ext.js" class="sf"></script>
		</div>
	</body>
</html>
